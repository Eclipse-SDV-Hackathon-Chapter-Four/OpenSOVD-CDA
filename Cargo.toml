#
# AZ3166 ECU simulator for the MXCHIP AZ3166 IoT DevKit (STM32F412, ThreadX).
# Independent fork of https://github.com/theswiftfox/flxc1000-rpi.

[workspace]
resolver = "2"
members = ["crates/az3166-doip", "crates/az3166-ecu", "crates/az3166-fw", "crates/az3166-speech"]
# Host-testable crates; the firmware crate only builds for thumbv7em-none-eabihf.
default-members = ["crates/az3166-doip", "crates/az3166-ecu", "crates/az3166-speech"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
heapless = "0.9"
libm = "0.2"

# ace — Automotive Communication Engine (UDS server), built without `std`
ace-server = { git = "https://github.com/samp-reston/ace.git", rev = "0706bef625fbde1d8fadbd84ea21bb8ee650f7e4", default-features = false }
ace-sim = { git = "https://github.com/samp-reston/ace.git", rev = "0706bef625fbde1d8fadbd84ea21bb8ee650f7e4", default-features = false }

az3166-doip = { path = "crates/az3166-doip" }
az3166-ecu = { path = "crates/az3166-ecu" }
az3166-speech = { path = "crates/az3166-speech" }

# ace-server vendored with local patches (vendor/ace-server/PATCHES.md)
[patch."https://github.com/samp-reston/ace.git"]
ace-server = { path = "vendor/ace-server" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"
